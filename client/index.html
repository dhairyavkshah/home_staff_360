<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="description" content="Home Staff 360 - Your Home's & Business's Operating System. Track attendance, wages, expenses, and more for your domestic staff and service businesses." />
    <meta name="theme-color" content="#0B57D0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Home Staff 360 - Your Home's & Business's Operating System</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <meta property="og:title" content="Home Staff 360 - Your Home's & Business's Operating System" />
    <meta property="og:description" content="Privacy-focused household staff & service business management system" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Early error suppression for Capacitor plugins in web mode
      // Must run before Vite's runtime-error-plugin loads
      (function() {
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          // Suppress non-Error object errors (common from Capacitor)
          if (!error || (typeof error === 'object' && !error.message && !error.stack)) {
            return true;
          }
          // Suppress Capacitor-related errors
          var msgStr = String(msg || '');
          if (msgStr.includes('Capacitor') || msgStr.includes('Haptics') || 
              msgStr.includes('not implemented') || msgStr.includes('not available')) {
            return true;
          }
          return originalOnError ? originalOnError(msg, url, line, col, error) : false;
        };
        
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          // Suppress non-Error rejections
          if (!reason) {
            event.preventDefault();
            return;
          }
          if (typeof reason === 'object' && !reason.message && !reason.stack) {
            event.preventDefault();
            return;
          }
          var reasonStr = String(reason);
          if (reasonStr.includes('Capacitor') || reasonStr.includes('Haptics') ||
              reasonStr.includes('not implemented') || reasonStr.includes('not available')) {
            event.preventDefault();
            return;
          }
        });
        
        window.addEventListener('error', function(event) {
          if (!event.error || (typeof event.error === 'object' && !event.error.message && !event.error.stack)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
