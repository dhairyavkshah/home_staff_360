    <meta property="og:description" content="Privacy-focused household staff & service business management system" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress non-Error runtime exceptions before Vite's error overlay sees them
      (function() {
        // Capture errors in capturing phase and stop propagation for non-Error objects
        window.addEventListener('error', function(event) {
          // Check if error is not a proper Error object
          if (!event.error || !(event.error instanceof Error)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
          // Also suppress Capacitor-related errors
          var msg = event.error.message || '';
          if (msg.includes('Capacitor') || msg.includes('Haptics') || 
              msg.includes('not implemented') || msg.includes('not available')) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true); // true = capturing phase, runs before bubbling
        
        // Also handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (!reason || !(reason instanceof Error)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return;
          }
          var reasonMsg = reason.message || '';
          if (reasonMsg.includes('Capacitor') || reasonMsg.includes('Haptics') ||
              reasonMsg.includes('not implemented') || reasonMsg.includes('not available')) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
        
        // Override onerror as backup
        window.onerror = function(msg, url, line, col, error) {
          if (!error || !(error instanceof Error)) {
            return true; // Suppress
          }
          return false;
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
