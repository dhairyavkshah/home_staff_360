name: Build Production AAB (Google Play)

on:
  workflow_dispatch:
  push:
    branches: [main, v4]
    paths:
      - 'android/**'
      - 'client/**'
      - 'shared/**'
    tags:
      - 'v*'

env:
  BUILD_ENV: production

jobs:
  build-prod-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=dev
      
      - name: Configure Production Capacitor
        run: |
          # Use production bundled/offline capacitor config
          cp capacitor.config.prod.ts capacitor.config.ts
          echo "Production offline config ready"
      
      - name: Build web app (Production)
        env:
          VITE_APP_ENV: production
        run: npm run build
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore configured; Gradle will produce an unsigned release AAB"
          fi
      
      - name: Build Signed AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      
      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
      
      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: homestaff360-prod-aab-v${{ steps.version.outputs.version_name }}-code${{ steps.version.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
