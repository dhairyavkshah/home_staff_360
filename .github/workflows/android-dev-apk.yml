name: Build Development APK

on:
  workflow_dispatch:
    inputs:
      dev_server_url:
        description: 'Development Server URL (your Replit dev URL)'
        required: true
        default: 'https://your-repl-name.username.repl.co'
  push:
    branches: [develop, feature/*]
    paths:
      - 'android/**'
      - 'client/**'
      - 'shared/**'

env:
  BUILD_ENV: development

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure Development Capacitor
        env:
          DEV_SERVER_URL: ${{ github.event.inputs.dev_server_url || 'https://homestaff360-dev.replit.app' }}
        run: |
          # Use development capacitor config
          cp capacitor.config.dev.ts capacitor.config.ts
          
          # Update the server URL in the config
          sed -i "s|https://homestaff360-dev.replit.app|${DEV_SERVER_URL}|g" capacitor.config.ts
          
          echo "Development config ready with URL: ${DEV_SERVER_URL}"
      
      - name: Build web app (Development)
        env:
          VITE_APP_ENV: development
          VITE_API_BASE_URL: ''
        run: npm run build
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      
      - name: Rename APK with version info
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HomeStaff360-DEV-${VERSION}.apk
      
      - name: Upload Development APK
        uses: actions/upload-artifact@v4
        with:
          name: homestaff360-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
