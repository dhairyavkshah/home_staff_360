name: Build Development APK

on:
  workflow_dispatch:
  push:
    branches: [develop, feature/*]
    paths:
      - 'android/**'
      - 'client/**'
      - 'shared/**'

env:
  BUILD_ENV: development

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Upgrade npm
        run: npm install --global npm@11.19.1

      - name: Use public npm registry
        run: sed -i 's#http://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Verify build tooling
        run: node -e "require.resolve('tsx'); require.resolve('vite'); console.log('Build tooling installed')"
      
      - name: Configure Development Capacitor
        run: |
          # Use development bundled/offline capacitor config
          cp capacitor.config.dev.ts capacitor.config.ts
          echo "Development offline config ready"
      
      - name: Build web app (Development)
        env:
          VITE_APP_ENV: development
        run: npm run build
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      
      - name: Rename APK with version info
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HomeStaff360-DEV-v${VERSION_NAME}-code${VERSION_CODE}.apk
      
      - name: Upload Development APK
        uses: actions/upload-artifact@v4
        with:
          name: homestaff360-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
